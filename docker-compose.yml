services:
  mmux-vite:
    image: mmux-vite
    build:
      context: .
      dockerfile: ./node/Dockerfile
    environment:
      NODE_ENV: development # ??
    ports:
      - 3000:3000 ## wrong port?

  flaskapi:
    image: flaskapi
    build:
      context: .
      dockerfile: ./flaskapi/Dockerfile
    environment:
      - FLASK_ENV=development
    ports:
      - 5000:5000