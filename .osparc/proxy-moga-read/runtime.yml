settings:
  - name: ports
    type: int
    value: 8888
  - name: Resources
    type: Resources
    value:
      Limits:
        NanoCPUs: 4000000000 # max 4 CPUs
        MemoryBytes: 12884901888 # 12 GB
      Reservations:
        NanoCPUs: 3000000000 # 3 CPUs reserved
        MemoryBytes: 12884901888 # 12 GB
paths-mapping:
  inputs_path: /tmp/inputs
  outputs_path: /tmp/outputs
  state_paths:
    - /text-files

compose-spec:
  version: "3.8"
  services:
    mmux-vite-backend:
      image: $$$${SIMCORE_REGISTRY}/simcore/services/dynamic/mmux-vite-backend:$$$${SERVICE_VERSION}
      environment:
        - SERVICE_MODE=MOGA
        - PERMISSIONS=READ-ONLY
        - DEPLOYMENT_MODE=OSPARC
    mmux-vite-web:
      image: $$$${SIMCORE_REGISTRY}/simcore/services/dynamic/mmux-vite-web:$$$${SERVICE_VERSION}

    mmux-vite-app:
      image: $$$${SIMCORE_REGISTRY}/simcore/services/dynamic/mmux-vite-app-moga-read:$$$${SERVICE_VERSION}
      depends_on:
        mmux-vite-backend:
          condition: service_healthy
        mmux-vite-web:
          condition: service_healthy
      environment:
        - BACKEND_SERVICE=%%container_name.mmux-vite-backend%%:5000
        - WEB_SERVICE=%%container_name.mmux-vite-web%%:8080

container-http-entrypoint: mmux-vite-app
