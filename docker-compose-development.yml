version: "3.7"
services:
  mmux-vite-backend:
    image: simcore/services/dynamic/mmux-vite-backend:1.0.0
    environment:
      - OSPARC_API_BASE_URL=${OSPARC_API_BASE_URL}
      - OSPARC_API_KEY=${OSPARC_API_KEY}
      - OSPARC_API_SECRET=${OSPARC_API_SECRET}
      - LOG_LEVEL=DEBUG
      - DEBUG_MODE=true
    volumes:
      - ./flaskapi:/app
  mmux-vite-web:
    # Using node:24-alpine for development with auto-reloading
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./node:/app  # Mount your local node folder to the container
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development
  mmux-vite-app:
    image: simcore/services/dynamic/mmux-vite-app:1.0.0
    environment:
      - WEB_SERVICE=mmux-vite-web:8080
      - BACKEND_SERVICE=mmux-vite-backend:5000
    ports:
      - "8888:8888"
    depends_on:
      - mmux-vite-backend
      - mmux-vite-web