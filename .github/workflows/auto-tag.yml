name: Tag and release

# A merged develop/main commit supplies its own base version (single-sourced
# in .bumpversion.cfg, SPEC.md §V5). On develop the bot appends/increments
# the `.devN` counter and ships a GitHub prerelease; on main it strips
# `.devN` (the release must already have been bumped), tags and publishes
# the GitHub release. There is no package-index publication — GitHub
# releases are the only artifact (see itis-sumo's auto-tag.yml for the
# channel rules this mirrors).
#
# Docs/validation/Markdown-only merges are excluded: they carry no version
# intent (SPEC.md §V39at is scoped to non-ignored changes).
#
# Publishing robustness:
# * Tags are never pushed standalone. `gh release create --target <sha>`
#   creates the tag and the release together, so a failed run cannot leave
#   a tag without its release; the recovery steps additionally create any
#   release that a partial gh failure orphaned from its tag.
# * `concurrency` queues one run per branch (never cancels mid-publish).
#   If a human merge advanced the branch mid-run, the bot push is rejected
#   as non-fast-forward and the bump loop refetches the new tip, recomputes
#   the version against fresh tags, and retries.
on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"
      - "validation/**"
      - "**/*.md"

concurrency:
  group: auto-tag-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_BRANCH: ${{ github.ref_name }}

jobs:
  develop-dev-tag:
    if: github.ref_name == 'develop' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Recover prereleases stranded by a partial run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          uv run --no-project --with packaging python scripts/auto_version.py dev-tags \
            | while read -r tag; do
                gh release view "$tag" >/dev/null 2>&1 && continue
                echo "creating missing prerelease for stranded tag $tag"
                gh release create "$tag" --prerelease --generate-notes --title "$tag (dev)"
              done

      - name: Bump dev version, fast-forward push with recompute retries
        id: bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --tags --force
            git fetch origin "$GH_BRANCH"
            git reset --hard "origin/$GH_BRANCH"
            version=$(uv run --no-project --with packaging python scripts/auto_version.py next-dev)
            uv run --no-project --with packaging python scripts/auto_version.py apply --to "$version"
            git diff --quiet && { echo "nothing to bump at $version"; break; }
            git commit -am "chore: bump dev version to $version [skip ci]"
            if git push origin "HEAD:$GH_BRANCH"; then
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push raced with another merge (attempt $attempt); recomputing"
          done
          echo "could not land the dev bump after 3 attempts" >&2
          exit 1

      - name: Publish GitHub prerelease (tag + release atomically)
        if: steps.bump.outputs.version != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.bump.outputs.version }}"
          gh release view "v$version" >/dev/null 2>&1 && exit 0
          gh release create "v$version" \
            --target "${{ steps.bump.outputs.target }}" \
            --prerelease --generate-notes --title "v$version (dev)"

  main-release:
    if: github.ref_name == 'main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Compute release version (strips .devN) with resume detection
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          git fetch origin "$GH_BRANCH"
          git reset --hard "origin/$GH_BRANCH"
          script=(uv run --no-project --with packaging python scripts/auto_version.py)
          if version=$("${script[@]}" strip-dev 2>strip-dev.err); then
            echo "action=full" >> "$GITHUB_OUTPUT"
          else
            # Rerun after a partial publish? Tolerate the candidate being
            # tagged, but only to resume: existing tag without release ->
            # release-only; tag + release -> done; no tag -> real failure.
            version=$("${script[@]}" strip-dev --allow-taken)
            if git tag --list "v$version" | grep -qx "v$version"; then
              if gh release view "v$version" >/dev/null 2>&1; then
                echo "v$version already published; nothing to do"
                echo "action=done" >> "$GITHUB_OUTPUT"
              else
                echo "resuming: tag v$version exists without its release"
                echo "action=release-only" >> "$GITHUB_OUTPUT"
              fi
            else
              cat strip-dev.err >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit stripped version (full path, fast-forward retries)
        id: commit
        if: steps.release.outputs.action == 'full'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          version="${{ steps.release.outputs.version }}"
          for attempt in 1 2 3; do
            uv run --no-project --with packaging python scripts/auto_version.py apply --to "$version"
            if git diff --quiet; then
              echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -am "chore: release version $version [skip ci]"
            if git push origin "HEAD:$GH_BRANCH"; then
              echo "target=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push raced with another merge (attempt $attempt); recomputing"
            git fetch --tags --force
            git fetch origin "$GH_BRANCH"
            git reset --hard "origin/$GH_BRANCH"
          done
          echo "could not land the release version after 3 attempts" >&2
          exit 1

      - name: Publish GitHub release (tag + release atomically)
        if: steps.release.outputs.action != 'done'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          gh release view "v$version" >/dev/null 2>&1 && exit 0
          if [ "${{ steps.release.outputs.action }}" = "full" ]; then
            gh release create "v$version" \
              --target "${{ steps.commit.outputs.target }}" \
              --generate-notes --title "v$version"
          else
            gh release create "v$version" --generate-notes --title "v$version"
          fi
