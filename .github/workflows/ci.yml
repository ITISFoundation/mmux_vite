name: Build and check image

on:
  # Run the workflow for pushes to the main branch
  push:
    branches:
      - main

  # Run the workflow for pull requests (from forks or within the repo)
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  node-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'node' # Here the path to the folder where package-lock.json is located.
    strategy:
      matrix:
        node-version: [24.x] # Are you are missing this specification?
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - name: Install dependencies
      run: npm ci
    - name: Run tests
      run: npm test

  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./flaskapi
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies (single source-of-truth)
      run: |
        ./install-deps.sh

    
    - name: Run Python tests
      run: |
        . .venv/bin/activate
        python -m pytest tests/ -v --cov-report=xml --cov-report=html
      env:
        LOG_LEVEL: DEBUG
        OSPARC_API_BASE_URL: https://test.osparc.io
        OSPARC_API_KEY: test_key
        OSPARC_API_SECRET: test_secret
        SERVICE_MODE: TEST
        PERMISSIONS: READ-ONLY
        DEPLOYMENT_MODE: LOCAL
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./flaskapi/coverage.xml
        flags: backend
        name: backend-coverage

  verify-image-build:
    needs: node-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v2
      - name: ooil version
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil --version
      - name: escape $${ in *.y*ml files configuration
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil legacy-escape
      - name: Assemble docker compose spec
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil compose
      - name: Build all images if multiple
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: docker compose build