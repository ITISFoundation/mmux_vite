name: Build and check image

on:
  # Run the workflow for pushes to the main branch
  push:
    branches:
      - main

  # Run the workflow for pull requests (from forks or within the repo)
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v7
      with:
        # full history + tags: the "Check release version" step's
        # auto_version.py check-pr validates the PR base against ALL existing
        # tags (small fetch cost, hygiene job only).
        fetch-depth: 0
        fetch-tags: true
    - name: Set up uv
      # Full-version pin: astral-sh/setup-uv no longer publishes bare major
      # tags (no `v10` ref exists), so `@v10` would fail to resolve.
      uses: astral-sh/setup-uv@v10.3.0
    # Release-version backstop for the auto-tag flow (folded in from the
    # standalone `version-check.yml`, deleted here: ~5 hosted slots at t=0 with
    # three workflows firing simultaneously — a 12-17 s check ⊥ own slot).
    # A PR changing the base version must bump to a clean X.Y.Z that clears
    # every existing tag (the `.devN` suffix is owned by the auto-tag bot) AND
    # exceeds its target branch's own base — for main that means a human base
    # bump landed on develop first — and the §V5 fanout must stay consistent
    # so a release never ships with drifted metadata.
    # Guard = the old `pull_request branches: [develop, main]` trigger: PRs to
    # other branches skip, AND ci.yml's push-to-main event (base_ref EMPTY)
    # no-ops — ⊥ ever passing an empty --target. The old paths-ignore
    # (docs/validation/*.md) is DROPPED deliberately: the check is cheap and
    # passes vacuously on doc-only PRs. Permissions: this job needs only
    # contents:read (checkout + tag fetch); ci.yml carries ⊥ workflow-level
    # `permissions:` block, so the GITHUB_TOKEN default applies — ⊥ narrower
    # block added here ⊥ risk the artifact/codecov steps that rely on defaults.
    # Runs EARLY (right after uv) so a versioned PR with a bad base fails fast.
    - name: Check release version
      if: github.base_ref == 'develop' || github.base_ref == 'main'
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        git fetch --tags --force
        uv run --no-project --with packaging python scripts/auto_version.py check-pr --target "$BASE_REF"
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - name: Install node dependencies
      run: cd node && npm ci
    - name: Generate oSPARC TypeScript client
      run: cd node && npm run generate-osparc-cli
    - name: Install Flask API dependencies
      run: make install-flaskapi-deps
    - name: Run prek
      run: uvx prek run --all-files

  node-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v7
    - name: Use Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - name: Install node dependencies
      run: cd node && npm ci
    - name: Generate oSPARC TypeScript client
      # src/osparc-api-ts-client/ is build-generated and NOT committed (§B16);
      # both knip and the vitest import graph resolve through it, so it must
      # exist before the first static check runs on a fresh checkout.
      run: cd node && npm run generate-osparc-cli
    - name: Check for dead code (knip)
      run: cd node && npm run knip
    - name: Run node tests with coverage
      run: cd node && npm run test:coverage
    - name: Upload node coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./node/coverage/cobertura-coverage.xml
        flags: node
        name: node-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  flaskapi-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v7
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Install Flask API dependencies
      run: make install-flaskapi-deps
    - name: Run flaskapi tests
      run: |
        cd flaskapi
        rm -f .coverage* coverage-*.xml
        COVERAGE_FILE=.coverage.regular uv run pytest tests/ -v -m "not analytical" --cov-report=html --cov-report=term-missing
        mv coverage.xml coverage-regular.xml
    - name: Run flaskapi analytical tests (Tier 3, real Dakota)
      run: |
        cd flaskapi
        COVERAGE_FILE=.coverage.analytical uv run pytest tests/ -v -m analytical --cov-report=html --cov-report=term-missing
        mv coverage.xml coverage-analytical.xml
    - name: Combine flaskapi coverage
      run: |
        cd flaskapi
        uv run coverage combine --data-file=.coverage.combined .coverage.regular .coverage.analytical
        uv run coverage xml --data-file=.coverage.combined -o coverage.xml
    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      with:
        files: ./flaskapi/coverage.xml
        flags: flaskapi
        name: flaskapi-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Read-only Playwright e2e suite (SuMo/UQ/MOGA; root SPEC §T11,§T12,§T47sl / §V10-§V13).
  # Runs inside the PINNED Playwright docker image so chromium + its bundled
  # fonts match the image the committed pixel baselines were generated in (§V12):
  # any host/runner font drift would otherwise break the snapshot comparison.
  # The tag MUST stay in lock-step with @playwright/test in node/package.json.
  #
  # SPLIT (root SPEC §T47sl): one shared prep job + 3 parallel lanes.
  # WHY: the old single e2e-tests job measured 234-315 s wall: ~48 s pre/post steps,
  # webServer boot ~109 s (openapi client generation 40-60 s + vite build), per-spec
  # test sum ~117 s, coverage teardown 10-20 s. The metric is WALL-CLOCK (⊥ job-
  # minutes: each lane boots its own backend+preview pair). Client generation and the
  # production build now happen ONCE in e2e-prep; lanes restore node_modules +
  # client + dist and run a file-grouped subset (E2E_PREBUILT=1 makes build:e2e a
  # no-op so ⊥ lane regenerates them).
  # Start at t=0: prep has ⊥ data dependency on the unit-test stages (its inputs are
  # the checkout + caches), and gating it on them only added ~100 s of their wall to
  # the e2e critical path (owner decision 2026-10-22; wasted lane job-minutes on a
  # sibling-stage RED = ACCEPTED cost, wall-clock is the objective). The LANES still
  # gate on e2e-prep — they require its client/dist artifacts.
  e2e-prep:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
      - name: Use Node.js 24
        # Warm `npm ci` cache. The image itself ships node 24 (== package engines),
        # so prep and lanes agree on the node major that node_modules is warmed under.
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: node/package-lock.json
      # node_modules is a pure function of the lockfile + this image + arch:
      # warm it so lanes skip `npm ci` entirely (cache-hit restore ≫ cold ci).
      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: node/node_modules
          key: e2e-node-modules-${{ runner.arch }}-playwright-v1.64.0-noble-${{ hashFiles('node/package-lock.json') }}
      - name: Install node dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: cd node && npm ci
      # The generated client (§B16, not committed) is a pure function of
      # node/openapi.json + openapitools.json + lockfile ⇒ cache it across runs;
      # the JRE is then installed ONLY on a cache miss (openapi-generator is Java).
      - name: Restore generated TS client cache
        id: client-cache
        uses: actions/cache@v6
        with:
          path: node/src/osparc-api-ts-client
          key: e2e-ts-client-playwright-v1.64.0-noble-${{ hashFiles('node/openapi.json', 'node/openapitools.json', 'node/package-lock.json') }}
      - name: Install Java runtime (only on TS client cache miss)
        if: steps.client-cache.outputs.cache-hit != 'true'
        # The Playwright image ships no JRE, but openapi-generator-cli requires
        # `java` (mirrors tests/e2e/scripts/gen-baselines.sh).
        run: apt-get update && apt-get install -y --no-install-recommends openjdk-21-jre-headless
      - name: Generate oSPARC TypeScript client (only on TS client cache miss)
        if: steps.client-cache.outputs.cache-hit != 'true'
        run: cd node && npm run generate-osparc-cli
      # E2E_COVERAGE=true gates vite's sourcemaps (node/vite.config.ts build.sourcemap):
      # the coverage teardown maps /assets/ scripts back to src, so the PREP build must
      # run with it — exactly the env the playwright webServer used for build:e2e before
      # the split. `build:e2e:compile` == the tsc+vite half of `build:e2e` (client is
      # already in place from cache/fresh generate above).
      - name: Build sourcemapped production dist
        run: cd node && npm run build:e2e:compile
        env:
          E2E_COVERAGE: 'true'
      - name: Upload generated TS client
        uses: actions/upload-artifact@v7
        with:
          name: e2e-prep-osparc-client
          path: node/src/osparc-api-ts-client
          retention-days: 7
      - name: Upload production dist
        uses: actions/upload-artifact@v7
        with:
          name: e2e-prep-dist
          path: node/dist
          retention-days: 7

  # LANES (root SPEC §V48sl): an EVOLVING partition of tests/e2e/*.spec.ts into NOW
  # 3 lanes (repacking between 2 and 4 lanes on the wall objective prep+boot+max(lane
  # tests) is a ci.yml + run-e2e-lane.sh edit + §T row, ⊥ a §V change — just re-sync
  # the required checks to whatever lane names result). Grouping is by SPEC FILE
  # name, ⊥ by test title: sibling PRs move tests between spec files (the a11y-fold
  # PR moves axe tests INTO the flow specs), and file-based lanes retarget
  # automatically on merge. a11y.spec.ts today (axe only, ⊥ pixel baselines) rides
  # `behavior`; once folded it moves to its destination file's lane automatically —
  # ⊥ CI edit needed. The lane lists + GUARD (pixel files + behavior files must
  # partition tests/e2e/*.spec.ts, so ⊥ spec silently drops out of every lane) live
  # in tests/e2e/scripts/run-e2e-lane.sh:
  #   uq-moga:  PIXEL-CAPTURING uq-readonly + moga-readonly (§V12-critical) +
  #             sobol-highdim — engine-heavy analysis-plot FLOW without a committed
  #             baseline yet (the capture arrives with the sibling a11y-fold PR, ⊥
  #             adding it here); it rides this lane for boot/test balance
  #   sumo:     PIXEL-CAPTURING sumo-readonly + sumo-write
  #   behavior: the INVERSE of the pixel-capturing lanes, computed at runtime per lane
  # §V12: every lane keeps the PINNED image and workers:1 (node/playwright.config.ts)
  # and boots its OWN webServer pair (reuseExistingServer stays false in CI).
  # Branch protection: the required check "e2e-tests" must become the three matrix
  # job names "e2e-tests (uq-moga)", "e2e-tests (sumo)", "e2e-tests (behavior)".
  e2e-tests:
    needs: e2e-prep
    strategy:
      fail-fast: false
      matrix:
        lane: [uq-moga, sumo, behavior]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
      # The Playwright image ships node + browsers but not GNU make (the Makefile
      # entry points need it). NB: NO JRE here — with the prep artifacts restored,
      # E2E_PREBUILT=1 means no lane ever regenerates the client.
      - name: Install make
        run: apt-get update && apt-get install -y --no-install-recommends make
      # uv drives the Flask backend the webServer boots (tests/e2e/scripts/run-e2e-backend.sh).
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v6
        with:
          path: node/node_modules
          key: e2e-node-modules-${{ runner.arch }}-playwright-v1.64.0-noble-${{ hashFiles('node/package-lock.json') }}
      - name: Install node dependencies (fallback if prep cache evicted)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: cd node && npm ci
      - name: Install Flask API dependencies
        run: make install-flaskapi-deps
      - name: Place prep-generated TS client
        uses: actions/download-artifact@v7
        with:
          name: e2e-prep-osparc-client
          path: node/src/osparc-api-ts-client
      - name: Place prep-built dist (vite preview serves this)
        uses: actions/download-artifact@v7
        with:
          name: e2e-prep-dist
          path: node/dist
      # Compares against the committed baselines under tests/e2e/__snapshots__.
      # Baselines are regenerated ONLY via `make test-e2e-update` in THIS image (§V12);
      # a non-green pixel diff fails the lane and (via branch protection) gates merge (§C).
      - name: Run Playwright e2e lane ${{ matrix.lane }} (pixel diff vs committed baselines)
        run: make test-e2e-lane LANE=${{ matrix.lane }}
        env:
          # webServer's build:e2e step becomes a no-op: client + dist came from e2e-prep.
          E2E_PREBUILT: '1'
      - name: Assert E2E coverage report exists
        run: test -s coverage/e2e/report/cobertura-coverage.xml
      - name: Upload E2E coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/e2e/report/cobertura-coverage.xml
          flags: e2e
          name: e2e-coverage-${{ matrix.lane }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Playwright report + screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.lane }}
          path: |
            node/playwright-report
            node/test-results
          if-no-files-found: warn
          retention-days: 14

  verify-image-build:
    needs:
      - prek
      - node-tests
      - flaskapi-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
      - name: ooil version
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil --version
      - name: escape $${ in *.y*ml files configuration
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil legacy-escape
      - name: Assemble docker compose spec
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil compose
      - name: Build all images if multiple
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: docker compose build
