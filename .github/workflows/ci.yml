name: Build and check image

on:
  # Run the workflow for pushes to the main branch
  push:
    branches:
      - main

  # Run the workflow for pull requests (from forks or within the repo)
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v5
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: '**/package-lock.json'
    - name: Run node tests
      run: make test-node

  flaskapi-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo content
      uses: actions/checkout@v5
    - name: Set up uv
      uses: astral-sh/setup-uv@v3
    - name: Install Flask API dependencies
      run: make install-flaskapi-deps
    - name: Run flaskapi tests
      run: make test-flaskapi
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./flaskapi/coverage.xml
        flags: flaskapi
        name: flaskapi-coverage

  verify-image-build:
    needs:
      - node-tests
      - flaskapi-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v5
      - name: ooil version
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil --version
      - name: escape $${ in *.y*ml files configuration
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil legacy-escape
      - name: Assemble docker compose spec
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: ooil compose
      - name: Build all images if multiple
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.23
        with:
          args: docker compose build
