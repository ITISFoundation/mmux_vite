name: CodSpeed benchmarks

on:
  # Run the workflow for pushes to the main branch (baseline for comparisons)
  push:
    branches:
      - main

  # Run the workflow for pull requests, so every PR gets a performance report
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

  # Allows CodSpeed to trigger backtest runs to generate initial data
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  flaskapi-benchmarks:
    name: Flask API benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        # Full-version pin: astral-sh/setup-uv no longer publishes bare major
        # tags (same rationale as .github/workflows/ci.yml).
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install Flask API dependencies
        run: make install-flaskapi-deps-locked
      # pytest-codspeed is installed as an overlay (uv run --with) instead of
      # being added to pyproject.toml: it is a benchmark-only dependency and
      # should not end up in the application lock file.
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          working-directory: flaskapi
          run: uv run --with 'pytest-codspeed>=5,<6' pytest benchmarks/ --codspeed --no-cov

  node-benchmarks:
    name: Frontend benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'
      - name: Install node dependencies
        run: cd node && npm ci
      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          working-directory: node
          run: npm run bench
