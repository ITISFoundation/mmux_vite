name: Check release version

# PR-time backstop for the auto-tag flow: a PR changing the base version
# must bump to a clean X.Y.Z that clears every existing tag (the `.devN`
# suffix is owned by the auto-tag bot) AND exceeds its target branch's own
# base — for main that means a human base bump landed on develop first —
# and the §V5 fanout must stay consistent so a release never ships with
# drifted metadata.
on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "docs/**"
      - "validation/**"
      - "**/*.md"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Validate PR version for its target branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          uv run --no-project --with packaging python scripts/auto_version.py check-pr --target "$BASE_REF"
