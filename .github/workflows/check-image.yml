name: Build and check image

on:
  # Run the workflow for pushes to the main branch
  push:
    branches:
      - main

  # Run the workflow for pull requests (from forks or within the repo)
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  verify-image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v2
      - name: ooil version
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.16-dev-15
        with:
          args: ooil --version
      - name: escape $${ in *.y*ml files configuration
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.16-dev-15
        with:
          args: ooil legacy-escape
      - name: Assemble docker compose spec
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.16-dev-15
        with:
          args: ooil compose
      - name: echo docker-compose.yml
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.16-dev-15
        with:
          args: cat docker-compose.yml
      - name: Build all images if multiple
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.16-dev-15
        with:
          args: docker compose build
      - name: inspect image
        uses: docker://itisfoundation/ci-service-integration-library:v2.1.16-dev-15
        with:
          args: docker inspect simcore/services/dynamic/mmux-vite-app-sumo-read:1.3.7