version: 2
updates:
  - package-ecosystem: npm
    directory: /node
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /flaskapi
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
