version: 2
updates:
  - package-ecosystem: npm
    directory: /node
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    ignore:
      - dependency-name: "@mui/material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/icons-material"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/x-data-grid"
        update-types: ["version-update:semver-major"]
      # eslint 10: @typescript-eslint 8, eslint-plugin-import and
      # eslint-plugin-react cap their peer ranges below 10; revisit once
      # they declare support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7: @typescript-eslint requires typescript <6.1, so lint
      # breaks on 7.x; revisit once it declares support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      javascript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /flaskapi
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Base images in the production Dockerfiles. The e2e suite pins the Playwright
  # IMAGE (ci.yml container:) in lock-step with @playwright/test, so that pin is
  # NOT dependabot-managed — only the runtime images below.
  - package-ecosystem: docker
    directory: /flaskapi
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /node
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /proxy
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Zurich
    groups:
      docker-dependencies:
        patterns:
          - "*"
