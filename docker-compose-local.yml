version: "3.7"
services:
  mmux-vite-backend:
    image: simcore/services/dynamic/mmux-vite-backend:1.0.0
    environment:
      - OSPARC_HOST=${OSPARC_HOST}
      - OSPARC_USER=${OSPARC_USER}
      - OSPARC_PASSWORD=${OSPARC_PASSWORD}
  mmux-vite-web:
    image: simcore/services/dynamic/mmux-vite-web:1.0.0
  mmux-vite-app:
    image: simcore/services/dynamic/mmux-vite-app:1.0.0
    environment:
      - WEB_SERVICE=mmux-vite-web:8080
      - BACKEND_SERVICE=mmux-vite-backend:5000
    ports:
      - "8888:8888"
    depends_on:
      mmux-vite-backend:
        condition: service_healthy
      mmux-vite-web:
        condition: service_healthy