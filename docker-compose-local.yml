services:
  mmux-vite-backend:
    image: simcore/services/dynamic/mmux-vite-backend:1.6.0
    environment:
      - OSPARC_API_BASE_URL=${OSPARC_API_BASE_URL}
      - OSPARC_API_KEY=${OSPARC_API_KEY}
      - OSPARC_API_SECRET=${OSPARC_API_SECRET}
      - LOG_LEVEL=DEBUG
      - SERVICE_MODE=${SERVICE_MODE}
      - PERMISSIONS=${PERMISSIONS}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE}
    volumes:
      - ./validation/text-files:/text-files
  mmux-vite-web:
    image: simcore/services/dynamic/mmux-vite-web:1.6.0
  mmux-vite-app:
    image: simcore/services/dynamic/${APP_IMAGE}:1.6.0
    environment:
      - WEB_SERVICE=mmux-vite-web:8080
      - BACKEND_SERVICE=mmux-vite-backend:5000
    ports:
      - "${APP_PORT:-8888}:8888"
    depends_on:
      mmux-vite-backend:
        condition: service_healthy
      mmux-vite-web:
        condition: service_healthy
