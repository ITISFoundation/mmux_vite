repos:
  # Python: ruff lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1
    hooks:
      - id: ruff
        args: [--fix]
        files: ^flaskapi/
      - id: ruff-format
        files: ^flaskapi/

  # Python: ty type checking (flaskapi/)
  - repo: local
    hooks:
      - id: ty-flaskapi
        name: ty (flaskapi/)
        language: system
        entry: bash flaskapi/scripts/run-ty-hook.sh
        files: ^flaskapi/
        pass_filenames: false

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=2000]

  # TypeScript/React: prettier via eslint (flat config requires cwd=node/)
  - repo: local
    hooks:
      - id: eslint-node
        name: ESLint (node/)
        language: system
        entry: bash node/scripts/run-eslint-hook.sh
        files: ^node/src/.*\.(ts|tsx|js|jsx)$

  # Docker: dev-mount services must not run as root (V31vr)
  - repo: local
    hooks:
      - id: no-root-dev-containers
        name: dev containers pin host UID (docker-compose-development.yml)
        language: system
        entry: bash scripts/check-compose-users.sh
        files: ^docker-compose-development\.yml$
        pass_filenames: false
